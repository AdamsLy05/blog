baseURL = "https://adamsly05.github.io/blog/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "理砚集"
theme = "stack"
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[related]
  includeNewer = true
  threshold = 60
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 50

[pagination]
  pagerSize = 6

[permalinks]
  post = "/p/:slug/"
  page = "/:slug/"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    style = "dracula"
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

[params]
  mainSections = ["post"]
  rssFullContent = true
  favicon = "img/avatar.jpg"
  dateFormat = { published = "2006 年 01 月 02 日", lastUpdated = "2006 年 01 月 02 日" }

  [params.footer]
    since = 2026
    customText = ""

  [params.sidebar]
    emoji = "✍️"
    subtitle = "记录一点东西，慢慢写"
    avatar = "img/avatar.jpg"

  [params.article]
    [params.article.license]
      enabled = false
    [params.article.headingAnchor]
      icon = "#"
    [params.article.math]
      enable = false

  [params.widgets]
    homepage = [
      { type = "search" },
      { type = "archives", params = { limit = 5 } },
      { type = "categories", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

  [params.comments]
    enabled = false

  [params.colorScheme]
    toggle = true
    default = "auto"

[[params.social]]
  identifier = "github"
  name = "GitHub"
  url = "https://github.com/AdamsLy05"
  [params.social.params]
    icon = "brand-github"

[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 2

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 3

[[menu.main]]
  identifier = "series"
  name = "系列"
  url = "/series/"
  weight = 4

[[menu.main]]
  identifier = "rss"
  name = "RSS"
  url = "/index.xml"
  weight = 5
