{{- $bg := "img/bg.jpg" | relURL -}}
<style>
  /* ---------- 底图 ---------- */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url("{{ $bg }}") center / cover no-repeat;
    opacity: .07;
    z-index: -1;
    pointer-events: none;
    filter: saturate(.8);
  }
  [data-scheme="dark"] body::before { opacity: .16; }

  /* ---------- 页面跳转过渡（View Transitions） ---------- */
  @view-transition { navigation: auto; }
  ::view-transition-old(root) {
    animation: 180ms cubic-bezier(.4,0,1,1) both vt-out;
  }
  ::view-transition-new(root) {
    animation: 260ms cubic-bezier(0,0,.2,1) both vt-in;
  }
  @keyframes vt-out { to { opacity: 0; transform: translateY(-6px); } }
  @keyframes vt-in  { from { opacity: 0; transform: translateY(10px); } }

  /* ---------- 进场动画 ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity .5s cubic-bezier(0,0,.2,1), transform .5s cubic-bezier(0,0,.2,1);
    will-change: opacity, transform;
  }
  .reveal.is-in { opacity: 1; transform: none; }

  /* ---------- 卡片与链接的细节 ---------- */
  .article-list article {
    transition: transform .25s ease, box-shadow .25s ease;
    border-radius: 12px;
  }
  .article-list article:hover { transform: translateY(-3px); }

  .article-subtitle a, .widget a {
    background-image: linear-gradient(currentColor, currentColor);
    background-size: 0% 1px;
    background-position: 0 100%;
    background-repeat: no-repeat;
    transition: background-size .3s ease;
  }
  .article-subtitle a:hover, .widget a:hover { background-size: 100% 1px; }

  /* ---------- 回到顶部 ---------- */
  #to-top {
    position: fixed;
    right: 16px;
    bottom: 20px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: rgba(30,30,30,.72);
    color: #fff;
    font-size: 18px;
    line-height: 42px;
    text-align: center;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    transition: opacity .25s ease, transform .25s ease;
    backdrop-filter: blur(8px);
    z-index: 99;
  }
  #to-top.show { opacity: 1; pointer-events: auto; transform: none; }

  /* ---------- 手机上菜单更紧凑 ---------- */
  @media (max-width: 768px) {
    /* 头部收紧：头像和标题并排 */
    .sidebar header {
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      justify-content: flex-start !important;
      text-align: left !important;
      gap: 12px;
      padding: 2px 0 0;
      margin: 0;
    }
    .site-meta { text-align: left !important; align-items: flex-start !important; }
    .site-avatar { margin: 0 !important; }
    .site-avatar img, .site-logo {
      width: 54px !important; height: 54px !important; border-radius: 50%; object-fit: cover;
    }
    .site-avatar .emoji { display: none; }
    .site-name { font-size: 1.3rem; margin: 0; line-height: 1.25; }
    .site-description { font-size: .85rem; margin: 3px 0 0; }

    /* 导航不再藏进汉堡，直接铺成胶囊按钮 */
    #toggle-menu, .hamburger { display: none !important; }
    #main-menu {
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
    }
    #main-menu > li { margin: 0; }
    #main-menu > li > a {
      display: inline-block;
      padding: 7px 16px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .055);
      font-size: .9rem;
      line-height: 1.2;
      transition: background .2s ease, color .2s ease;
    }
    #main-menu > li > a:active { transform: scale(.97); }
    #main-menu > li.current > a { color: #fff; background: var(--card-background, #333); }
    [data-scheme="dark"] #main-menu > li > a { background: rgba(255, 255, 255, .09); }
    [data-scheme="dark"] #main-menu > li.current > a { color: #111; background: #eee; }

    /* 收紧上下空白 */
    .sidebar.left-sidebar { padding-top: 6px !important; padding-bottom: 4px !important; }
    .sidebar header { margin-bottom: 0 !important; }
    #main-menu { margin: 10px 0 2px !important; }
    .main { padding-top: 4px !important; }
    .widget { margin-bottom: 14px; }

    /* 胶囊再明显一点 */
    #main-menu > li > a { background: rgba(0, 0, 0, .075) !important; }
    #main-menu > li.current > a { background: #3d2f26 !important; color: #fff !important; }
    [data-scheme="dark"] #main-menu > li > a { background: rgba(255, 255, 255, .12) !important; }
  }

  /* ---------- 尊重系统减少动效 ---------- */
  @media (prefers-reduced-motion: reduce) {
    @view-transition { navigation: none; }
    .reveal { opacity: 1; transform: none; transition: none; }
    .article-list article { transition: none; }
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
  }
</style>
<script>
  (function () {
    function init() {
      // 进场动画：卡片依次浮现
      var items = document.querySelectorAll(
        '.article-list article, .widget, .article-list--compact li'
      );
      if (!('IntersectionObserver' in window) ||
          window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          var el = e.target;
          var i = parseInt(el.dataset.revealIndex || '0', 10);
          setTimeout(function () { el.classList.add('is-in'); }, i * 70);
          io.unobserve(el);
        });
      }, { threshold: 0, rootMargin: '0px 0px -60px 0px' });

      items.forEach(function (el, i) {
        el.classList.add('reveal');
        el.dataset.revealIndex = i % 6;
        io.observe(el);
      });

      // 回到顶部
      var btn = document.createElement('button');
      btn.id = 'to-top';
      btn.type = 'button';
      btn.setAttribute('aria-label', '回到顶部');
      btn.textContent = '↑';
      document.body.appendChild(btn);
      btn.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      var onScroll = function () {
        btn.classList.toggle('show', window.scrollY > 480);
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
    // 跨页过渡替换 DOM 后重新初始化
    document.addEventListener('astro:page-load', init);
  })();
</script>

<style>
  /* ---------- 阅读进度条 ---------- */
  #reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 2px;
    width: 0;
    background: var(--accent-color-darker, #7aa2c8);
    z-index: 200;
    pointer-events: none;
    transition: width .08s linear;
  }
</style>
<script>
  (function () {
    function initProgress() {
      var old = document.getElementById('reading-progress');
      if (old) old.remove();
      var content = document.querySelector('.article-content');
      if (!content) return;

      var bar = document.createElement('div');
      bar.id = 'reading-progress';
      document.body.appendChild(bar);

      var update = function () {
        var rect = content.getBoundingClientRect();
        var total = content.offsetHeight - window.innerHeight;
        if (total <= 0) { bar.style.width = '100%'; return; }
        var read = -rect.top + 120;
        var pct = Math.min(Math.max(read / total, 0), 1) * 100;
        bar.style.width = pct.toFixed(2) + '%';
      };

      window.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', update);
      update();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initProgress);
    } else {
      initProgress();
    }
    document.addEventListener('astro:page-load', initProgress);
  })();
</script>
